<!-- instagram clone  -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instagram</title>
    <link rel="shortcut icon" href="inslogo.webp" type="image/x-icon">
    <link rel="stylesheet" href="inst.css" />
    <script src="https://kit.fontawesome.com/f9425a5d7b.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="contanier">
        <div id="left">
            <div id="logo">

                <span><img style="width: 150px;" src="inslogo.webp" alt=""></span>

                <!-- <h1>
                    Explore the things
                    <span style="color: rgb(0, 100, 224)">you love</span>.
                </h1> -->
            </div>

            <div id="images">
                <h1 style="margin-top: 90px;">See everyday moments from your close friends.</h1>
                <img src="insimg.webp" alt="images" />

            </div>

        </div>

        <div id="right">
            <div id="logincontainer">
                <h4 style="margin-top: 70px;color: white;">Log in to Instagram</h4>
                <input type="text" placeholder="Email address or mobile number" />
                <input type="password" placeholder="Password" />
                <button style="
              background-color: rgb(49, 114, 194);
              color: white;
              height: 46px;
              margin: 10px;
              border-radius: 25px;
              border: none;
              cursor: not-allowed;
              font-weight: 700;

            ">
                    Log in
                </button>
                <button id="forbtn">Forgotten password?</button>
                <button id="facebook"> Log in with Facebook</button>
                <button id="cnabtn">Create new account</button>
                <span style="
              text-align: center;
              font-weight: 500;
              margin-top: 7px;
              font-size: 22px;
            "><i class="fa-brands fa-meta" style="color: rgb(116, 192, 252)"></i>Meta</span>
            </div>
        </div>
        
    </div>

    <footer>

    </footer>
</body>

</html>
