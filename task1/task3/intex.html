<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <title>New Tab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: flex-end;
        }

        .right {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding-right: 2px;
        }

        a {
            color: black;
            font-size: 15px;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #profile {
            border-radius: 50%;
        }

        #main {
            /* border: 3px solid black; */
            height: 300px;
            width: fit-content;
            margin: auto;

            /* display: flex;
            flex-direction: column;
            justify-content: center; */
        }

        .bottom {
            /* border: 3px solid green; */
            height: 25vh;
            width: 50vw;
            margin: auto;
            position: relative;
            top: 18vh;
            background-color: rgb(239, 244, 252);
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            border-radius: 17px;
            margin-top: 30px;

        }

        footer {
            display: flex;
            gap: 40vw;
            margin-bottom: 10px;

        }

        .landingpageimgcontainer {
            /* border: 3px solid; */
            display: flex;
            justify-content: center;
        }

        #Share {
            position: absolute;
            top: 32vh;
            left: 68vw;
            border-radius: 50%;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(239, 244, 252);

        }
        

        #SearchBor {
            /* border: 1px solid yellow; */
            border-radius: 30px;
            width: fit-content;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;

        }

        input {

            border: none;
            width: 40vw;
            outline: none;

        }

        #sec {
            display: flex;
            justify-content: center;

        }

        .ai {
            background-color: rgb(239, 244, 252);
            display: flex;
            gap: 2px;

            border-radius: 20px;
            padding: 10px 7px;
        }

        .ai:hover {
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;


        }

        #btndiv {
            position: relative;

            top: 5vh;
            text-align: center;


        }

        #btndiv button {
            border-radius: 50%;
            padding: 15px;
            border: none;
        }

        #head {
            display: flex;
            gap: 35vw;
            padding: 10px 0px 0px 13px;

        }

        .hchild {

            height: 15vh;
            margin: 0px 20px 0px 20px;
            padding: 10px;
            background-color: white;

        }

        #fb:hover {
            background-color: rgb(239, 244, 252);
            cursor: pointer;

        }

        .botlogo {

            display: flex;
            justify-content: left;
            align-items: center;
            /* border: 2px solid red; */
        }

        /* .botlogo:hover{
            background-color: aliceblue;
        } */

        .fcontent {
            /* border: 2px solid red; */
            display: flex;
            flex-direction: column;
        }

        #btndiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 8vw;
            margin: auto;
            padding: 19px 0px 10px 0px;

            cursor: pointer;

        }

        #btndiv:hover {
            background-color: rgb(239, 244, 252);
            border: 1px solid rgb(239, 244, 252);
            border-radius: 12px;
        }
      
    </style>
