<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            color: white;

        }
        .container{
            background-color: white;
            color: black;
            border: 2px solid red;
            height: 100vh;
            width: 65vw;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
        }
        .left{
            border: 2px solid blue;
            
        }
        .right{
            border: 5px solid green;
        }
        .image{
            text-align: center;

        }

        img{
            padding: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;

        }
        img:hover{
            box-shadow: 20px 2px 40px seashell;
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="image">
                <img src="6305405762179633820.jpg" alt="Rakesh image">
            </div>
            
        </div>
        <div class="right">

        </div>
    </div>
</body>
</html>
